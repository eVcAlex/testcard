# A throwaway Worker for the web-player spike. Separate from testcard-sync: nothing here touches the real site, API or database.
name = "testcard-web-spike"
main = "proxy.mjs"
compatibility_date = "2025-01-01"
workers_dev = true

# The test page, served from the same origin as the proxy. /p runs the Worker; everything else is a static file.
[assets]
directory = "./public"
run_worker_first = ["/p"]
