name = "testcard-sync"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Installed apps call https://testcard-sync.evcalex.workers.dev; with `routes` set, wrangler 4 would default workers_dev to false.
workers_dev = true

# A sync call makes several trips to D1 (the session lookup, then the reads or writes), and D1 lives in one region.
# Smart Placement runs the Worker near the database instead of near the caller once it has seen enough traffic to
# tell it helps. Static files (apps/web) are served before the Worker runs, so the site is not affected.
[placement]
mode = "smart"

# Custom domain: wrangler creates the DNS record and certificate on deploy (zone evicted.dev is on this account).
routes = [
  { pattern = "evicted.dev", custom_domain = true },
  { pattern = "www.evicted.dev", custom_domain = true },
  { pattern = "sync.evicted.dev", custom_domain = true },
]

# The website (apps/web). API paths run the Worker first; everything else is a static file, and an unknown
# path gets the build's real dist/404.html with a 404 status (no SPA fallback). Every API path, `/app/*` and
# `/waitlist` included, must be listed in run_worker_first so a browser navigation never reaches the 404 page.
[assets]
directory = "../web/dist"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash" # canonical URLs have no trailing slash: /download is the page, /download/ redirects to it
run_worker_first = ["/app/*", "/auth/*", "/link/start", "/link/session", "/link/approve", "/link/poll", "/sync/*", "/guides/*", "/share", "/share/*", "/watch/p", "/waitlist"]

# SYNC_AUTH_SECRET (better-auth signing/encryption secret) is deliberately NOT declared here: a [vars]
# entry is deployed as a plain var and replaces the real secret. Deployed: `wrangler secret put
# SYNC_AUTH_SECRET`. Local `wrangler dev`: .dev.vars (gitignored). Worker tests: vitest.config.ts.

# The web player (apps/player, served at /watch) streams through /watch/p. Off until switched on: this makes the Worker carry
# viewers' video, so check Cloudflare's terms and the bill first. Change to "on" and deploy to enable.
[vars]
WEB_PLAYER = "off"
# Megabytes of video one account may stream through the web player per UTC day (20 GB). 0 removes the cap.
WATCH_DAILY_CAP_MB = "20480"

[[d1_databases]]
binding = "DB"
database_name = "testcard-sync"
database_id = "41722575-4662-49c5-8fd6-01b7cb47132b"
migrations_dir = "migrations"

# Cloudflare Email Sending: the waitlist confirmation mail.
[[send_email]]
name = "EMAIL"

# Build output only: the update manifest and the APKs the app downloads. Files are put with
# scripts/release-android.mjs; the worker serves them read-only at /app/<file>.
[[r2_buckets]]
binding = "RELEASES"
bucket_name = "testcard-releases"
