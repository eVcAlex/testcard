appId: dev.alexmcguiness.testcard
productName: Testcard
directories:
  output: ../../release
  buildResources: build
files:
  - out/**/*
extraResources:
  - from: resources/mpv
    to: mpv
    filter: ["**/*"]
win:
  target: nsis
  # Unsigned for now — see the plan's "Ship" decision. SmartScreen will warn once on install;
  # revisit code signing only if this is ever released publicly.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
publish:
  # The private GitHub repo cannot serve downloads, so releases live in the sync worker's release
  # bucket (ADR 0010): latest.yml and the installer are served from /app/.
  provider: generic
  url: https://testcard-sync.evcalex.workers.dev/app
