<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Renderer never talks to a provider directly — the main process owns all Xtream/M3U
      fetches and credentials (see src/main/credentials.ts) — so connect-src stays 'self'.
      img-src: https: covers legacy direct logo loads; testcard-logo: is the main-process
      logo cache (src/main/logoCache.ts) that channel cards use now.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: testcard-logo:; font-src 'self' data:; connect-src 'self';" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Testcard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
