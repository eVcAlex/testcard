name: Sync worker

# Deploys the sync worker (apps/sync-worker) to Cloudflare whenever main changes it or the schema it serves, after
# applying any new D1 migrations. Older apps keep working against a newer worker, so the worker goes first.
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts, D1 and R2 edit) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths:
      - apps/sync-worker/**
      - packages/sync-schema/**
      - .github/workflows/sync-worker.yml
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than racing an older one's migrations.
concurrency:
  group: sync-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts --filter "@testcard/sync-worker..."

      - name: Check it before it goes out
        working-directory: apps/sync-worker
        run: |
          pnpm run typecheck
          pnpm run test

      - name: Apply new D1 migrations
        working-directory: apps/sync-worker
        run: pnpm exec wrangler d1 migrations apply testcard-sync --remote

      - name: Deploy the worker
        working-directory: apps/sync-worker
        run: pnpm exec wrangler deploy
