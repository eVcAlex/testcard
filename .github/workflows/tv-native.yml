name: TV native

# The native Kotlin + Compose Fire TV app (apps/tv-native, ADR 0012). Checks run on every change to it or to the TypeScript
# core whose test vectors it must reproduce. "Run workflow" on main builds the release APK and publishes it to the update
# server as the Fire TV app (an in-place update of the old Expo app, ADR 0012); on any other branch the APK is only kept as an artifact.
on:
  push:
    paths: ["apps/tv-native/**", "packages/core/**", ".github/workflows/tv-native.yml"]
  pull_request:
    paths: ["apps/tv-native/**", "packages/core/**", ".github/workflows/tv-native.yml"]
  workflow_dispatch:

jobs:
  # The TypeScript side of the contract: the committed test vectors must still be what the real TS core produces.
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@testcard/core..."
      - run: pnpm --filter @testcard/core exec vitest run src/__tests__/vectors.test.ts src/__tests__/dbVectors.test.ts src/__tests__/migrationVectors.test.ts

  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tv-native
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the update manifest can list what changed since the last published build.
          fetch-depth: 0

      # Every sentence the React Native app shows must be in the native app too (allowances: parity/strings-allow.txt).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node parity/strings-diff.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No Gradle wrapper is checked in, so the action supplies Gradle itself.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - run: gradle :core:test :app:assembleDebug :app:lintDebug --no-daemon

      - name: Build the release APK
        if: github.event_name == 'workflow_dispatch'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          fi
          # This app has the old app's id, so its versionCode (100000 + run number, set in build.gradle.kts) must be above
          # every old build for Android to accept it as an update.
          gradle :app:assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: testcard-tv-native
          path: apps/tv-native/app/build/outputs/apk/release/*.apk

      # Built from main, the APK goes to the update server: the APK first, then the manifest that points at it, so a device
      # never sees a manifest for a file that is not there yet. It takes over the old app's entry (apks.firetv).
      - name: Publish to the update server
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No CLOUDFLARE_API_TOKEN secret: not publishing."; exit 0; fi
          CODE=$((100000 + ${{ github.run_number }}))
          echo "{\"versionCode\":$CODE,\"versionName\":\"0.2.${{ github.run_number }}\"}" > build.json
          cp apps/tv-native/app/build/outputs/apk/release/app-release.apk testcard-firetv.apk
          APK="testcard-firetv-$CODE.apk"
          node scripts/release-manifest.mjs build.json "$APK" "$GITHUB_SHA" latest.json
          npx --yes wrangler@3 r2 object put "testcard-releases/$APK" --file testcard-firetv.apk --content-type application/vnd.android.package-archive
          npx --yes wrangler@3 r2 object put testcard-releases/testcard-firetv.apk --file testcard-firetv.apk --content-type application/vnd.android.package-archive
          npx --yes wrangler@3 r2 object put testcard-releases/latest.json --file latest.json --content-type application/json
          echo "Published $(node -p "require('./build.json').versionName")"
