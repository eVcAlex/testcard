name: TV guides

# Once a day, builds the small guide file for every public TV guide address the apps have registered with the Worker
# (see scripts/build-guides.mjs) and puts each in the update bucket, where the Fire TV app fetches it instead of
# unpacking and parsing the whole guide itself. Needs the repository secrets CLOUDFLARE_API_TOKEN (D1 read, R2 edit)
# and CLOUDFLARE_ACCOUNT_ID, as the Sync worker and Android APK workflows do.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: guides
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The parser is packages/core's; it needs only its own dependencies (sax, fflate).
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter "@testcard/core..."

      - name: Build the guide files
        # Fails the run if a guide failed, but the step after still uploads the ones that were built.
        continue-on-error: true
        id: build
        run: node --experimental-strip-types --import ./scripts/ts-resolve.mjs scripts/build-guides.mjs guides

      # Gzipped on disk; stored with that encoding so the Worker serves it as such and the app's HTTP stack unpacks it.
      - name: Upload to the update bucket
        run: |
          [ -s guides/built.txt ] || { echo "Nothing built."; exit 0; }
          while read -r file; do
            npx --yes wrangler@3 r2 object put "testcard-releases/$file" --file "guides/$file" --content-type application/json --content-encoding gzip
          done < guides/built.txt

      - name: Fail if a guide failed
        if: steps.build.outcome == 'failure'
        run: exit 1
