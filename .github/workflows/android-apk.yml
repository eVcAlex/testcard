name: Android APK

# Builds sideloadable APKs of the Android app for Fire TV / Android TV. (Phones are not supported for now:
# the layout is drawn for a TV and does not fit a phone screen.)
# Run it from the Actions tab ("Run workflow"), then download the APKs from the run's artifacts.
# The APKs are signed with Expo's debug key, which is fine for sideloading but not for a store.
# The Fire TV build is 32-bit ARM only (every Fire stick runs it, and it halves the native compile time).
# A Fire TV build of main is then published to the update server (the R2 bucket the app updates from, ADR 0010), with
# what changed since the last one, so devices offer it. `pnpm release:android <run-id>` still publishes any run by hand.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which APK to build. firetv is the release; debug loads its JavaScript from a dev server (pnpm android run)
        type: choice
        options: [firetv, debug]
        default: firetv

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.target == 'debug' && '[{"target":"debug","tv":"1","task":"assembleDebug -PreactNativeArchitectures=x86_64,arm64-v8a","apk":"debug/app-debug.apk"}]' || '[{"target":"firetv","tv":"1","task":"assembleRelease -PreactNativeArchitectures=armeabi-v7a","apk":"release/app-release.apk"}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the update manifest can list what changed since the last published build.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Reuses Gradle's downloads and build cache between runs, which is most of a rebuild's time.
      - uses: gradle/actions/setup-gradle@v4

      # Only the mobile app and what it depends on. Scripts are skipped because the desktop app's
      # postinstall rebuilds better-sqlite3 for Electron, which this job does not need.
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter "@testcard/mobile..."

      # Android refuses an update that is not a higher versionCode, so every build gets the run number.
      - name: Stamp the version
        working-directory: apps/mobile
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('app.json','utf8'));c.expo.android.versionCode=${{ github.run_number }};c.expo.version='0.1.${{ github.run_number }}';fs.writeFileSync('app.json',JSON.stringify(c,null,2));fs.writeFileSync('../../build.json',JSON.stringify({versionCode:${{ github.run_number }},versionName:'0.1.${{ github.run_number }}'}))"

      - name: Generate the native project
        working-directory: apps/mobile
        env:
          EXPO_TV: ${{ matrix.tv }}
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Build the release APK
        working-directory: apps/mobile/android
        run: ./gradlew ${{ matrix.task }} --no-daemon --build-cache

      - name: Name the APK
        run: cp apps/mobile/android/app/build/outputs/apk/${{ matrix.apk }} testcard-${{ matrix.target }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: testcard-${{ matrix.target }}
          path: |
            testcard-${{ matrix.target }}.apk
            build.json
          if-no-files-found: error

      # Built from main, the Fire TV APK goes straight to the update server: the APK first, then the manifest that
      # points at it, so a device never sees a manifest for a file that is not there yet.
      - name: Publish to the update server
        if: matrix.target == 'firetv' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No CLOUDFLARE_API_TOKEN secret: not publishing."; exit 0; fi
          # Each build's APK has a name of its own, so no cache between the bucket and a device can hand out an older one.
          APK="testcard-firetv-${{ github.run_number }}.apk"
          node scripts/release-manifest.mjs build.json "$APK" "$GITHUB_SHA" latest.json
          npx --yes wrangler@3 r2 object put "testcard-releases/$APK" --file testcard-firetv.apk --content-type application/vnd.android.package-archive
          npx --yes wrangler@3 r2 object put testcard-releases/latest.json --file latest.json --content-type application/json
          echo "Published $(node -p "require('./build.json').versionName")"
