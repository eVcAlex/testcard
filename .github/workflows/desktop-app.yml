name: Desktop app

# Builds the Windows installer for the desktop app whenever main changes it or what it depends on.
# The build is then published to the update server (the R2 bucket the app updates from, ADR 0010), so
# running apps offer it. Also runnable by hand from the Actions tab; `pnpm release:desktop` still
# publishes a local build by hand.
on:
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - packages/core/**
      - packages/sync-schema/**
      - .github/workflows/desktop-app.yml
  pull_request:
    paths:
      - apps/desktop/**
      - packages/core/**
      - packages/sync-schema/**
      - .github/workflows/desktop-app.yml
  workflow_dispatch:

# One build at a time; a newer push's build is what should end up published, not an older one still running.
concurrency:
  group: desktop-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # electron-updater only installs a strictly higher version. The run number alone would
      # undershoot 0.1.2, already shipped by hand, so it's added on top of the committed patch instead.
      - name: Stamp the version
        working-directory: apps/desktop
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));const patch=Number(p.version.split('.')[2]);p.version='0.1.'+(patch+${{ github.run_number }});fs.writeFileSync('package.json',JSON.stringify(p,null,2))"

      # Full install (not --ignore-scripts): the postinstall rebuilds better-sqlite3 for Electron.
      # sync-worker is pulled in too: release-desktop.mjs publishes through its wrangler.
      - run: pnpm install --frozen-lockfile --filter "@testcard/desktop..." --filter "@testcard/sync-worker..."

      # mpv is not in the repo (scripts/fetch-mpv.md). The build bundles it, so CI fetches the one pinned release and refuses
      # anything whose SHA256 differs: bump both together, from the release page, when mpv is updated.
      - name: Fetch the pinned mpv
        shell: pwsh
        run: |
          $url = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260903/mpv-x86_64-20260903-git-69e63f425a.7z"
          $sha = "418dbfb5feb851cbed33d6c05d8481ba71802621bfd6efe8974522b28d42ac97"
          Invoke-WebRequest $url -OutFile mpv.7z
          if ((Get-FileHash mpv.7z -Algorithm SHA256).Hash.ToLower() -ne $sha) { throw "mpv archive does not match the pinned SHA256" }
          New-Item -ItemType Directory -Force apps/desktop/resources/mpv | Out-Null
          7z e mpv.7z -oapps/desktop/resources/mpv mpv.exe d3dcompiler_43.dll -y
          if (-not (Test-Path apps/desktop/resources/mpv/mpv.exe)) { throw "mpv.exe not in the archive" }

      - run: pnpm --filter @testcard/desktop package

      - uses: actions/upload-artifact@v4
        with:
          name: testcard-desktop
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error

      # Built from main, the installer goes straight to the update server: the installer first, then the
      # manifest that points at it, so a running app never reads a manifest for a file that is not there yet.
      - name: Publish to the update server
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if (-not $env:CLOUDFLARE_API_TOKEN) { echo "No CLOUDFLARE_API_TOKEN secret: not publishing."; exit 0 }
          node scripts/release-desktop.mjs
